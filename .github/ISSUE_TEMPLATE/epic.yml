name: 묶음 (epic)
description: FE · BE · AI 에 걸치는 기능 — 각 레포 이슈를 하위 이슈로 붙인다 (ETC 레포 전용)
labels: ["epic"]
body:
  - type: input
    id: spec
    attributes:
      label: SPEC 참조
      placeholder: "F-01"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 데모에서 보이는 모습
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: 필요한 계약
      description: docs/contracts/ 의 어느 파일 · 엔드포인트
  - type: textarea
    id: split
    attributes:
      label: 레포별 하위 이슈
      value: |
        - [ ] FE:
        - [ ] BE:
        - [ ] AI:
